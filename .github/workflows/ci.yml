# 持续集成：前端构建/测试与容器验收，后端在独立 PostgreSQL 服务中测试。
# 其中固定测试凭据只用于临时 CI 数据库。

name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # 检查前端源码、测试和实际静态容器响应。
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run build && npm test
        working-directory: web
      - run: node tools/upstream_oracle.mjs
      - name: Build and verify the frontend Docker runtime
        run: |
          docker build -t passarchive-web:ci web
          docker run -d --name passarchive-web-ci --read-only --tmpfs /tmp:size=16m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true --memory 128m --pids-limit 64 -p 127.0.0.1:18083:8080 passarchive-web:ci
          trap 'docker logs --tail 20 passarchive-web-ci; docker rm -f passarchive-web-ci >/dev/null' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-connrefused --retry-delay 1 http://127.0.0.1:18083/healthz
          python3 tools/verify_web_container.py
  # 使用 PostgreSQL 运行数据库迁移检查和后端测试，覆盖真实并发分支。
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: passarchive-ci-only
          POSTGRES_DB: passarchive_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d passarchive_ci"
          --health-interval 10s --health-timeout 5s --health-retries 6
    env:
      DJANGO_DEBUG: 'true'
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: passarchive_ci
      DB_USER: postgres
      DB_PASSWORD: passarchive-ci-only # disposable service fixture, never a production credential
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test api --noinput
  # 原生统计和同步规则、模拟器构建，以及临时 SQLite 下的真实客户端联调。
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements.txt
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: swift test --package-path ios --scratch-path artifacts/ios-swift-tests
      - run: xcodebuild -project ios/PassArchive.xcodeproj -scheme PassArchive -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath artifacts/ios-build CODE_SIGNING_ALLOWED=NO build
      - run: .venv/bin/python tools/verify_ios_api.py
