name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run build && npm test
        working-directory: web
      - run: node tools/upstream_oracle.mjs
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: passarchive-ci-only
          POSTGRES_DB: passarchive_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d passarchive_ci"
          --health-interval 10s --health-timeout 5s --health-retries 6
    env:
      DJANGO_DEBUG: 'true'
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: passarchive_ci
      DB_USER: postgres
      DB_PASSWORD: passarchive-ci-only # disposable service fixture, never a production credential
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test api --noinput
