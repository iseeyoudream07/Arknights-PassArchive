limit_req_zone $binary_remote_addr zone=passarchive_api:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name passarchive.example;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/passarchive-acme;
        try_files $uri =404;
    }
    location / { return 301 https://passarchive.example$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name passarchive.example;
    ssl_certificate /etc/letsencrypt/live/passarchive.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/passarchive.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/passarchive/web/dist;
    index index.html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; worker-src 'self'" always;
    access_log /var/log/nginx/passarchive.access.log;
    error_log /var/log/nginx/passarchive.error.log;
    location /api/ {
        limit_req zone=passarchive_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /sw.js { expires -1; try_files $uri =404; }
    location = /index.html { expires -1; try_files $uri =404; }
    # Only the isolated terminal may be embedded, and only by this origin.
    location = /terminal.html {
        expires -1;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; worker-src 'self'" always;
        try_files $uri =404;
    }
    location = /app-cache.json { expires -1; try_files $uri =404; }
    location = /catalog.json { expires 5m; try_files $uri =404; }
    location /assets/ { expires 7d; try_files $uri =404; }
    location /rhine/ { expires 7d; try_files $uri =404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
