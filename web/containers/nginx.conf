# Web 容器内的静态服务配置；账号 API 由外层入口分流。

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;
        add_header X-PassArchive-Runtime "docker" always;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location ~ /\. { deny all; }
        # APIs are routed by the HTTPS ingress, never by the SPA fallback.
        # API 路径不能回退成 index.html，否则前端会把 HTML 当作 JSON。
        location /api/ { return 404; }
        # 离线脚本和清单要求及时更新，避免浏览器长时间沿用旧缓存策略。
        location = /sw.js { expires -1; try_files $uri =404; }
        location = /rhine/sw.js { expires -1; try_files $uri =404; }
        location = /app-cache.json { expires -1; try_files $uri =404; }
        location = /rhine-cache.json { expires -1; try_files $uri =404; }
        location = /catalog.json { expires 5m; try_files $uri =404; }
        location ~ \.html$ { expires -1; try_files $uri =404; }
        # 静态资源允许较长缓存；缺失文件明确返回 404。
        location /assets/ { expires 7d; try_files $uri =404; }
        location /rhine/ { expires 7d; try_files $uri =404; }
        # 普通页面导航可回退到首页，独立 HTML 与资源在上方单独处理。
        location / { expires -1; try_files $uri $uri/ /index.html; }
    }
}
