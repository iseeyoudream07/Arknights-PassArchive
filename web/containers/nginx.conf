worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;
        add_header X-PassArchive-Runtime "docker" always;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location ~ /\. { deny all; }
        # APIs are routed by the HTTPS ingress, never by the SPA fallback.
        location /api/ { return 404; }
        location = /sw.js { expires -1; try_files $uri =404; }
        location = /rhine/sw.js { expires -1; try_files $uri =404; }
        location = /app-cache.json { expires -1; try_files $uri =404; }
        location = /rhine-cache.json { expires -1; try_files $uri =404; }
        location = /catalog.json { expires 5m; try_files $uri =404; }
        location ~ \.html$ { expires -1; try_files $uri =404; }
        location /assets/ { expires 7d; try_files $uri =404; }
        location /rhine/ { expires 7d; try_files $uri =404; }
        location / { expires -1; try_files $uri $uri/ /index.html; }
    }
}
